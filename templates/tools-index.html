<!-- Internal Tools Index Template -->
{% extends 'base.html' %}
{% block title %}Tools Hub | Caliga{% endblock %}

{% block content %}
<div style="padding: 1rem 0;">
    <!-- Page Header -->
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Internal Tools</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">Select any of the available tools below.</p>
    </div>

    <!-- Tools Navigation Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem;">
        {% for tool in tools %}
        <div style="background: var(--bg-surface); border: 1px solid var(--bg-border); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1.25rem;">
            
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div>
                    <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin: 0 0 0.35rem 0;">{{ tool.name }}</h2>
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0; line-height: 1.45;">
                        {{ tool.description }}
                    </p>
                </div>
            </div>

            <!-- Launch Route Button -->
            <a href="{{ tool.route }}" style="display: block; text-align: center; background: var(--bg-primary); border: 1px solid var(--bg-border); color: var(--text-main); padding: 0.65rem; border-radius: 6px; font-weight: 600; font-size: 0.875rem; text-decoration: none; transition: border-color 0.15s, color 0.15s;" class="tool-launch-btn">
                Launch {{ tool.name }} ↗
            </a>

        </div>
        {% endfor %}
    </div>
</div>

<!-- Component Hover Styles -->
<style>
.tool-launch-btn:hover {
    border-color: var(--accent-primary) !important;
    color: var(--accent-primary) !important;
}
</style>
{% endblock %}
